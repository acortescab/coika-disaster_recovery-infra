name: CI

on:
  pull_request:
    paths:
      - "lambdas/**"
      - "infra/**"
      - ".github/**"
      - "ruff.toml"
  workflow_dispatch:

permissions:
  contents: read

# Runs are queued, not cancelled: killing `terraform plan` halfway can leave the state locked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # The state was written by this version; an older Terraform refuses to read it.
  TF_VERSION: "1.15.5"

jobs:
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      infra: ${{ steps.infra.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        run: |
          python .github/scripts/changed_lambdas.py \
            --base "${{ github.event.pull_request.base.sha }}"
      - id: infra
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ] || git diff --name-only "$base" HEAD | grep -qE '^(infra/|\.github/workflows/ci\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  lambda:
    name: ${{ matrix.lambda.name }}
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        lambda: ${{ fromJSON(needs.detect.outputs.matrix) }}
    permissions:
      contents: read
    uses: ./.github/workflows/lambda-ci.yml
    with:
      lambda_path: ${{ matrix.lambda.path }}

  terraform-plan:
    name: Terraform plan
    needs: detect
    if: needs.detect.outputs.infra == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: infra
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_dr_region: ${{ vars.AWS_REGION }}
      TF_VAR_name_prefix: ${{ vars.LAMBDA_NAME_PREFIX }}
      TF_VAR_ecr_prefix: ${{ vars.ECR_REPOSITORY_PREFIX }}
      TF_VAR_health_check_url: ${{ vars.HEALTH_CHECK_URL }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform fmt
        run: terraform fmt -check -diff -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=5m -detailed-exitcode -out=tfplan
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Render plan
        if: steps.plan.outputs.exitcode != '1'
        run: terraform show -no-color tfplan > "$RUNNER_TEMP/plan.txt"

      - name: Comment plan on the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_EXIT_CODE: ${{ steps.plan.outputs.exitcode }}
          PLAN_FILE: ${{ runner.temp }}/plan.txt
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan -->';
            const exitCode = process.env.PLAN_EXIT_CODE;
            const limit = 60000; // GitHub comments are capped at 65536 characters

            let plan = '';
            if (exitCode === '0' || exitCode === '2') {
              plan = fs.readFileSync(process.env.PLAN_FILE, 'utf8');
            }

            const summary = (plan.match(/^(Plan:.*|No changes\..*)$/m) || [])[0]
              || (exitCode === '0' || exitCode === '2' ? 'Plan completed.' : 'Terraform failed before producing a plan, check the job logs.');
            const status = exitCode === '0' ? 'No changes' : exitCode === '2' ? 'Changes pending' : 'Failed';

            const truncated = plan.length > limit;
            const body = [
              marker,
              '### Terraform plan',
              `**Status:** ${status}`,
              `**Outcome:** ${summary}`,
              '',
              plan
                ? ['<details><summary>Full plan</summary>', '', '```hcl', truncated ? plan.slice(0, limit) + '\n... (truncated, see the job logs)' : plan, '```', '', '</details>'].join('\n')
                : '',
              '',
              `_Commit ${context.sha.slice(0, 7)} · [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find((c) => c.body && c.body.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if the plan failed
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1
