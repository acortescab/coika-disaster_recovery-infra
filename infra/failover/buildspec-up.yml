# Buildspec of the `-up` CodeBuild project (see infra/codebuild.tf). It runs the Terraform of the
# auth service repo in the DR region. Variables (TF_VERSION, TF_ACTION, STATE_BUCKET, STATE_KEY,
# DR_REGION and TF_VAR_*) come from the project's environment.
#
# TF_ACTION: plan (default) | apply (bring the service up).
version: 0.2

phases:
  install:
    commands:
      - |
        case "${TF_ACTION}" in
          plan|apply) ;;
          *) echo "TF_ACTION must be plan or apply (got '${TF_ACTION}')"; exit 1 ;;
        esac
      - curl -sSfo tf.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
      - unzip -q tf.zip -d /usr/local/bin && terraform version
  build:
    commands:
      - >-
        terraform init -input=false
        -backend-config="bucket=${STATE_BUCKET}"
        -backend-config="region=${DR_REGION}"
        -backend-config="key=${STATE_KEY}"
      - |
        # ECR creates the replicated repository by itself; adopt it before applying.
        if [ "${TF_ACTION}" = "apply" ] \
           && ! terraform state show aws_ecr_repository.app >/dev/null 2>&1 \
           && aws ecr describe-repositories --region "${DR_REGION}" --repository-names coika/auth_service >/dev/null 2>&1; then
          terraform import -input=false aws_ecr_repository.app coika/auth_service
        fi
      - terraform plan -input=false -out=tfplan
      - if [ "${TF_ACTION}" = "apply" ]; then terraform apply -input=false tfplan; fi
